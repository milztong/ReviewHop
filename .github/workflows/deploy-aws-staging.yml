name: Deploy optional AWS staging

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to build, plan, apply, and smoke-test staging
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy staging
    if: inputs.confirmation == 'DEPLOY' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_owner: ${{ vars.OWNER }}
      TF_VAR_image_tag: ${{ github.sha }}
      TF_VAR_domain_name: ${{ vars.STAGING_DOMAIN_NAME }}
      TF_VAR_hosted_zone_id: ${{ vars.STAGING_HOSTED_ZONE_ID }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_monthly_budget_usd: ${{ vars.MONTHLY_BUDGET_USD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ankileet-staging-${{ github.run_id }}

      - name: Sign in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2

      - name: Resolve immutable image destinations
        id: images
        shell: bash
        run: |
          backend_repository="$(aws ecr describe-repositories --repository-names ankileet-staging-backend --query 'repositories[0].repositoryUri' --output text)"
          frontend_repository="$(aws ecr describe-repositories --repository-names ankileet-staging-frontend --query 'repositories[0].repositoryUri' --output text)"
          echo "backend=${backend_repository}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend=${frontend_repository}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: docker build --tag "${{ steps.images.outputs.backend }}" backend

      - name: Build frontend image
        run: docker build --tag "${{ steps.images.outputs.frontend }}" frontend

      - name: Push immutable images
        shell: bash
        run: |
          if aws ecr describe-images --repository-name ankileet-staging-backend --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "Backend image ${GITHUB_SHA} already exists and remains immutable"
          else
            docker push "${{ steps.images.outputs.backend }}"
          fi
          if aws ecr describe-images --repository-name ankileet-staging-frontend --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "Frontend image ${GITHUB_SHA} already exists and remains immutable"
          else
            docker push "${{ steps.images.outputs.frontend }}"
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.16.7
          terraform_wrapper: false

      - name: Initialize remote state
        working-directory: infrastructure/aws/staging
        run: >-
          terraform init
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="region=${AWS_REGION}"

      - name: Validate Terraform
        working-directory: infrastructure/aws/staging
        run: terraform validate

      - name: Create deployment plan
        working-directory: infrastructure/aws/staging
        run: terraform plan -out=staging.tfplan

      - name: Apply approved plan
        working-directory: infrastructure/aws/staging
        run: terraform apply -auto-approve staging.tfplan

      - name: Smoke-test deployed BFF
        working-directory: infrastructure/aws/staging
        shell: bash
        run: |
          application_url="$(terraform output -raw application_url)"
          for attempt in {1..30}; do
            if response="$(curl --fail --silent --show-error --max-time 10 "${application_url}/api/system-status")" \
              && jq -e '.state == "ready" and .status.database == "READY"' <<< "$response"; then
              echo "Staging smoke test passed: ${application_url}"
              exit 0
            fi
            echo "Attempt ${attempt}/30 is not ready yet"
            sleep 10
          done
          echo "Staging did not become ready within five minutes" >&2
          exit 1

      - name: Publish deployment summary
        if: success()
        working-directory: infrastructure/aws/staging
        shell: bash
        run: |
          application_url="$(terraform output -raw application_url)"
          {
            echo "### ReviewHop staging deployed"
            echo "- URL: ${application_url}"
            echo "- Image tag: ${GITHUB_SHA}"
            echo "- Authentication: GitHub OIDC; no long-lived AWS key"
          } >> "$GITHUB_STEP_SUMMARY"
