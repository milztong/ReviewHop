name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Repository security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Scan repository for committed secrets
        run: >-
          docker run --rm
          --volume "$PWD:/workspace"
          aquasec/trivy:0.76.2
          fs --offline-scan --scanners secret
          --secret-config /workspace/security/trivy/secret.yaml
          --skip-dirs '**/.git' --skip-dirs '**/.git/**'
          --skip-dirs '**/node_modules' --skip-dirs '**/node_modules/**'
          --skip-dirs '**/.next' --skip-dirs '**/.next/**'
          --skip-dirs '**/target' --skip-dirs '**/target/**'
          --skip-dirs '**/.terraform' --skip-dirs '**/.terraform/**'
          --skip-dirs '**/test-results' --skip-dirs '**/test-results/**'
          --exit-code 1 --severity HIGH,CRITICAL /workspace

  terraform:
    name: Terraform verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint GitHub Actions workflows
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          --workdir /repo
          rhysd/actionlint:1.7.12

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.16.7

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: Initialize TFLint plugins
        working-directory: infrastructure
        run: tflint --init --config=.tflint.hcl

      - name: Check formatting
        run: terraform fmt -check -recursive infrastructure

      - name: Initialize optional AWS bootstrap without remote state
        working-directory: infrastructure/aws/bootstrap
        run: terraform init -backend=false -input=false

      - name: Validate optional AWS bootstrap
        working-directory: infrastructure/aws/bootstrap
        run: terraform validate

      - name: Initialize optional AWS staging without remote state
        working-directory: infrastructure/aws/staging
        run: terraform init -backend=false -input=false

      - name: Validate optional AWS staging
        working-directory: infrastructure/aws/staging
        run: terraform validate

      - name: Test optional AWS guardrails with a mocked provider
        working-directory: infrastructure/aws/staging
        run: terraform test

      - name: Initialize Hetzner demo without applying
        working-directory: infrastructure/hetzner
        run: terraform init -backend=false -input=false

      - name: Validate Hetzner demo
        working-directory: infrastructure/hetzner
        run: terraform validate

      - name: Test Hetzner guardrails with a mocked provider
        working-directory: infrastructure/hetzner
        run: terraform test

      - name: Lint optional AWS bootstrap
        working-directory: infrastructure
        run: tflint --chdir=aws/bootstrap --config=../../.tflint.hcl

      - name: Lint optional AWS staging
        working-directory: infrastructure
        run: tflint --chdir=aws/staging --config=../../.tflint.hcl

      - name: Lint Hetzner demo
        working-directory: infrastructure/hetzner
        run: tflint --config=.tflint.hcl

      - name: Scan Terraform for high and critical misconfigurations
        run: >-
          docker run --rm
          --volume "$PWD:/workspace"
          --workdir /workspace
          aquasec/trivy:0.76.2
          config --exit-code 1 --severity HIGH,CRITICAL infrastructure

  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify backend
        run: mvn --batch-mode --no-transfer-progress verify

  backup-restore:
    name: Backup and restore verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify restart, encrypted backup and isolated restore
        run: bash scripts/verify-backup-restore.sh

  frontend:
    name: Frontend verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit high and critical dependency vulnerabilities
        run: npm run audit:ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate ephemeral runtime secrets
        shell: bash
        run: |
          set -euo pipefail

          append_env() {
            printf '%s=%s\n' "$1" "$2" >> "${GITHUB_ENV}"
          }

          append_secret() {
            local name="$1"
            local value
            value="$(openssl rand -hex 32)"
            printf '::add-mask::%s\n' "${value}"
            append_env "${name}" "${value}"
          }

          append_env POSTGRES_DB ankileet
          append_env POSTGRES_USER ankileet_migrator
          append_env ANKILEET_APP_DB_USERNAME ankileet_app
          append_env KEYCLOAK_ADMIN_USERNAME e2e-admin
          append_env E2E_ALICE_USERNAME alice
          append_env E2E_BOB_USERNAME bob
          append_secret POSTGRES_PASSWORD
          append_secret ANKILEET_APP_DB_PASSWORD
          append_secret KEYCLOAK_ADMIN_PASSWORD
          append_secret ANKILEET_WEB_CLIENT_SECRET
          append_secret AUTH_SECRET
          append_secret E2E_ALICE_PASSWORD
          append_secret E2E_BOB_PASSWORD

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium with system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start isolated application stack
        run: docker compose up --detach --build --wait --wait-timeout 240

      - name: Provision ephemeral Keycloak users
        run: bash scripts/provision-e2e-users.sh

      - name: Run two-user browser flow
        working-directory: frontend
        run: npm run test:e2e

      - name: Capture portfolio screenshots in the isolated stack
        working-directory: frontend
        env:
          ANKILEET_PORTFOLIO_SCREENSHOTS: test-results/portfolio
        run: npm run test:e2e -- --project chromium --grep "captures the portfolio"

      - name: Upload portfolio screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portfolio-screenshots-${{ github.sha }}
          path: frontend/test-results/portfolio/*.png
          if-no-files-found: error

      - name: Enable ephemeral performance client
        run: bash scripts/enable-performance-client.sh

      - name: Verify critical-path capacity budgets
        run: >-
          docker compose
          --file compose.yml
          --file compose.performance.yml
          --profile performance
          run --rm performance
          run --no-usage-report /scripts/critical-path.js

      - name: Show container logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Remove isolated application stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  containers:
    name: Container build
    runs-on: ubuntu-latest
    needs: [terraform, backend, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          GRAFANA_ADMIN_PASSWORD=compose-validation-only docker compose --file compose.yml --file compose.observability.yml config --quiet
          docker compose --file compose.yml --file compose.performance.yml config --quiet
          docker compose --file deploy/hetzner/compose.yml --env-file deploy/hetzner/.env.example config --quiet
          docker compose --file deploy/hetzner/compose.yml --file deploy/hetzner/compose.backup.yml --env-file deploy/hetzner/.env.example config --quiet
          docker compose --file deploy/hetzner/compose.yml --file deploy/hetzner/compose.observability.yml --env-file deploy/hetzner/.env.example config --quiet

      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          --env DOMAIN=demo.ankileet.example
          --env KEYCLOAK_DOMAIN=auth.demo.ankileet.example
          --env KEYCLOAK_ADMIN_DOMAIN=auth-admin.demo.ankileet.example
          --env KEYCLOAK_ADMIN_ALLOWED_CIDRS=192.0.2.10/32
          --volume "$PWD/deploy/hetzner/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10.2-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build images
        run: |
          docker compose build
          docker build --tag reviewhop-keycloak:latest deploy/keycloak
          docker build --tag reviewhop-backup:latest deploy/backup

      - name: Scan backend operating system and Java packages
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          --volume ankileet-ci-trivy-cache:/root/.cache/trivy
          --volume "$PWD:/workspace"
          --workdir /workspace
          aquasec/trivy:0.76.2
          image --scanners vuln --pkg-types os,library --ignore-unfixed
          --ignorefile security/trivy/backend-ignore.yaml --show-suppressed
          --exit-code 1 --severity HIGH,CRITICAL reviewhop-backend:latest

      - name: Scan frontend operating system packages
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          --volume ankileet-ci-trivy-cache:/root/.cache/trivy
          aquasec/trivy:0.76.2
          image --scanners vuln --pkg-types os --ignore-unfixed
          --exit-code 1 --severity HIGH,CRITICAL reviewhop-frontend:latest

      - name: Scan Keycloak operating system and Java packages
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          --volume ankileet-ci-trivy-cache:/root/.cache/trivy
          --volume "$PWD:/workspace"
          --workdir /workspace
          aquasec/trivy:0.76.2
          image --timeout 15m --scanners vuln
          --ignorefile security/trivy/keycloak-ignore.yaml --show-suppressed
          --exit-code 1 --severity HIGH,CRITICAL reviewhop-keycloak:latest

      - name: Scan backup operating system packages
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          --volume ankileet-ci-trivy-cache:/root/.cache/trivy
          aquasec/trivy:0.76.2
          image --scanners vuln --pkg-types os --ignore-unfixed
          --exit-code 1 --severity HIGH,CRITICAL reviewhop-backup:latest

      - name: Generate CycloneDX inventory for the built images
        run: bash scripts/generate-sboms.sh

      - name: Upload container inventories
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-sboms-${{ github.sha }}
          path: artifacts/sbom/*.cdx.json
          if-no-files-found: error
