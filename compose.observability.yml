services:
  backend:
    environment:
      ANKILEET_TELEMETRY_EXPORT_ENABLED: "true"
      ANKILEET_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      ANKILEET_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      ANKILEET_DEPLOYMENT_ENVIRONMENT: local

  worker:
    environment:
      ANKILEET_TELEMETRY_EXPORT_ENABLED: "true"
      ANKILEET_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      ANKILEET_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      ANKILEET_DEPLOYMENT_ENVIRONMENT: local

  docker-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy@sha256:6beb1743581ec3b2ed1a2bafd617e8c7a1d7ae2fe835293e333327618fc2b925
    environment:
      CONTAINERS: "1"
      ALLOW_LOGS: "1"
      INFO: "1"
      NETWORKS: "1"
      SERVICES: "0"
      TASKS: "0"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs: [/run, /tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [ankileet]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on: [tempo]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [ankileet]

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [ankileet]

  tempo:
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [ankileet]

  loki:
    image: grafana/loki:3.7.10
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [ankileet]

  alloy:
    image: grafana/alloy:v1.20.1
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [docker-socket-proxy, loki]
    user: "473:473"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [ankileet]

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-ankileet-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, tempo, loki]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [ankileet]

volumes:
  prometheus-data:
  tempo-data:
  loki-data:
  alloy-data:
  grafana-data:
