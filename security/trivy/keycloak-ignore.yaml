vulnerabilities:
  - id: CVE-2026-102554
    purls:
      - pkg:maven/com.google.guava/guava@33.6.0-jre
    expired_at: 2027-01-15
    statement: >-
      Keycloak issue 54855 is labelled status/not-vulnerable because Keycloak does not
      expose the affected Guava deserialization path. ReviewHop installs no custom
      Keycloak extensions. Re-evaluate on a new Keycloak release or by 2027-01-15.
  - id: CVE-2026-119373
    purls:
      - pkg:rpm/redhat/sqlite-libs@3.34.1-11.el9_8?arch=x86_64&distro=redhat-9.9
    expired_at: 2026-12-20
    statement: >-
      Exploitation requires an application-controlled FTS5 database. Keycloak does not
      support SQLite and ReviewHop configures Keycloak with PostgreSQL. Re-evaluate on a
      new Keycloak release or by 2026-12-20.
  - id: CVE-2026-119374
    purls:
      - pkg:rpm/redhat/sqlite-libs@3.34.1-11.el9_8?arch=x86_64&distro=redhat-9.9
    expired_at: 2026-12-20
    statement: >-
      Exploitation requires a crafted FTS5 database with secure-delete enabled. Keycloak
      does not support SQLite and ReviewHop configures Keycloak with PostgreSQL. Re-evaluate
      on a new Keycloak release or by 2026-12-20.
  - id: CVE-2026-119379
    purls:
      - pkg:rpm/redhat/sqlite-libs@3.34.1-11.el9_8?arch=x86_64&distro=redhat-9.9
    expired_at: 2026-12-20
    statement: >-
      Exploitation requires processing an untrusted SQLite session changeset. Keycloak
      does not support SQLite and ReviewHop configures Keycloak with PostgreSQL. Re-evaluate
      on a new Keycloak release or by 2026-12-20.
  - id: CVE-2026-119586
    purls:
      - pkg:rpm/redhat/sqlite-libs@3.34.1-11.el9_8?arch=x86_64&distro=redhat-9.9
    expired_at: 2026-12-20
    statement: >-
      The issue requires the SQLite CLI .recover command and piping its output into another
      CLI process. The image contains sqlite-libs, while Keycloak does not support SQLite
      and ReviewHop runs no SQLite CLI workflow. Re-evaluate by 2026-12-20.
  - id: CVE-2026-91403
    purls:
      - pkg:rpm/redhat/java-21-openjdk-headless@21.0.13.1.2-1.2.el9?arch=x86_64&distro=redhat-9.9&epoch=1
    expired_at: 2027-01-15
    statement: >-
      Red Hat states that RHEL OpenJDK uses the system trust store and that the correct
      remediation is the ca-certificates update for CVE-2026-114406. The image contains
      the fixed RHEL 9 package 2026.2.92_v9.0.319-90.3.el9_8. Re-evaluate by 2027-01-15.
